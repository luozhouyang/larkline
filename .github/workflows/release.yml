# larkline release pipeline.
#
# Mirrors the macOS signing/notarization setup used by coffer-desktop:
# Developer ID signing plus `notarytool` notarization, driven by repository
# secrets. A macOS release fails loudly when the secrets are absent, so we
# never silently ship a binary that Gatekeeper blocks.
#
# Required repository secrets:
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    Apple ID used for notarization
#   APPLE_PASSWORD              app-specific password for that Apple ID
#   APPLE_TEAM_ID               Apple team identifier
#
# Windows Authenticode signing is not configured yet: SmartScreen warnings are
# tolerated for now.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  build-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: larkline-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: larkline-linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # The ARM runner is natively aarch64, so `musl-gcc` from musl-tools is
      # the right C compiler for both jobs. cc-rs only probes for
      # `aarch64-linux-musl-gcc` there, which musl-tools does not install.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Add musl target
        run: rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build static binary
        run: |
          # musl targets default to static-PIE, which `file` reports as
          # "static-pie linked". Build a classic static executable instead so
          # the verification step can assert the plain "statically linked"
          # marker. `--config` scopes the flag to the target crates; a global
          # RUSTFLAGS would also hit host proc macros, which must stay
          # position-independent.
          cargo build --release --locked --target "${{ matrix.target }}" \
            --config 'target.${{ matrix.target }}.rustflags=["-C","relocation-model=static"]'
      - name: Verify static linking
        run: |
          binary="target/${{ matrix.target }}/release/larkline"
          file "$binary"
          if ! file "$binary" | grep -q "statically linked"; then
            echo "::error::$binary is not statically linked"
            exit 1
          fi
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/larkline" dist/larkline
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" larkline
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  build-macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Require Apple secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_ID" ]; then
            echo "::error::Missing APPLE_* secrets; refusing to ship an unsigned macOS binary"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/larkline \
            target/x86_64-apple-darwin/release/larkline \
            -output larkline
          file larkline

      - name: Sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" larkline
          codesign --verify --strict --verbose=2 larkline

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # notarytool accepts zip/pkg/dmg; a bare binary must be zipped.
          zip -q -r larkline-darwin-universal.zip larkline
          xcrun notarytool submit larkline-darwin-universal.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          # The zip itself cannot be stapled; the ticket is attached to the
          # signed binary inside it, so Gatekeeper validates on first run.
          xcrun stapler validate larkline || true
      - uses: actions/upload-artifact@v7
        with:
          name: larkline-darwin-universal
          path: larkline-darwin-universal.zip

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/larkline.exe -DestinationPath larkline-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: larkline-windows-x86_64
          path: larkline-windows-x86_64.zip

  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
