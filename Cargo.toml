[workspace]
resolver = "3"
members = [
  "crates/larkline-core",
  "crates/larkline-lark",
  "crates/larkline-agent",
  "crates/larkline-bridge",
  "crates/larkline-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/luozhouyang/larkline"

[workspace.dependencies]
larkline-core = { path = "crates/larkline-core" }
larkline-lark = { path = "crates/larkline-lark" }
larkline-agent = { path = "crates/larkline-agent" }
larkline-bridge = { path = "crates/larkline-bridge" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
getrandom = "0.3"
fs4 = "0.13"
dirs = "6"
whoami = "1"
hostname = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }
